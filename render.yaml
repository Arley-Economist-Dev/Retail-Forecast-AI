# ==============================================================================
# Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: retail-forecast-ai
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LLM_PROVIDER
        value: "auto"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
